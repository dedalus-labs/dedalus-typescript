name: TypeScript SDK CI

on:
  push:
  pull_request:

# Least privilege for a verification-only workflow: every job below only reads the checked-out
# tree, so the run's GITHUB_TOKEN is narrowed to that regardless of the repository's default
# grants. Declared at the workflow level so a job added later inherits the floor.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm is pinned through the action's `version` input, not a `packageManager` field in
      # package.json: that field would ship in the published package, and the action refuses to run
      # when the two name different versions.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.16.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The generator writes no lockfile, so the generated branch never carries one, while a branch
      # that commits `pnpm-lock.yaml` wants every install held to it, the release job most of all.
      # `--frozen-lockfile` fails outright with no lockfile, so it is passed only when one exists.
      # Both flags are spelled out rather than left to pnpm's own default, so the install does not
      # depend on the `CI` variable or on that default staying the same in a later pnpm.
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm run build
      # Verification only, never auto-fix: the SDK is generated formatted, so a diff here means
      # either hand-edited custom code or a regenerate that was not committed. Auto-fixing would
      # make the pushed bytes differ from generator output. `format` without `--write` is already
      # check-only and exits non-zero on a diff; Biome has no `--check` flag, and `biome ci` is
      # avoided so enabling the linter in this repo's biome.json cannot fail CI on generator-owned
      # code the shipped config deliberately exempts.
      - run: npx --yes @biomejs/biome@2.6.6 format .
